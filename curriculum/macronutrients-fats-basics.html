.notes{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px 24px;line-height:1.6}.notes h2{margin:4px 0 8px;font-family:var(--serif);font-weight:500;font-size:1.7rem}

<div class="hero"><div class="in"><button id="theme">Dark</button><nav class="crumbs"><a href="../">Food Label Tree</a> › <a href="./">Curriculum</a> › Module 1</nav><h1>Module 1 · Fats, step by step</h1><p>From single atoms to a whole fat molecule in 16 steps. Tell students "go to Step N".</p><p class="pnl">Next: <a href="macronutrients-fats.html">Fats: shapes, omegas and trans</a> →</p></div></div><div class="findex"><span>Steps</span><a href="#step-1" title="Meet the atoms in fat">1</a><a href="#step-2" title="Single bond vs double bond">2</a><a href="#step-3" title="Carbons link into a zigzag chain">3</a><a href="#step-4" title="Three ways to draw the same chain">4</a><a href="#step-5" title="The acid head: the carboxyl group">5</a><a href="#step-6" title="A fatty acid = acid head + carbon tail">6</a><a href="#step-7" title="A long fatty acid: stearic acid">7</a><a href="#step-8" title="Saturated = full of hydrogen">8</a><a href="#step-9" title="A double bond removes two hydrogens">9</a><a href="#step-10" title="Cis vs trans">10</a><a href="#step-11" title="One cis double bond = one kink: oleic acid">11</a><a href="#step-12" title="Straight vs kinked, side by side">12</a><a href="#step-13" title="Space-filling: the real shape">13</a><a href="#step-14" title="Why shape decides solid vs liquid">14</a><a href="#step-15" title="Omega numbers: count from the tail">15</a><a href="#step-16" title="Putting it together: a triglyceride">16</a></div><main><figure class="fig" id="step-1"><div class="fh"><a class="badge" href="#step-1">1</a><div><div class="fl">Step 1</div><h3>Meet the atoms in fat</h3></div></div><div class="art"><img src="img/fats-basics/step-01.png" alt="Step 1: Meet the atoms in fat" loading="eager" decoding="async"></div><figcaption>Fat is built from just three kinds of atom: carbon (dark grey, makes 4 bonds), hydrogen (white, makes 1 bond) and oxygen (red, makes 2 bonds).</figcaption></figure><figure class="fig" id="step-2"><div class="fh"><a class="badge" href="#step-2">2</a><div><div class="fl">Step 2</div><h3>Single bond vs double bond</h3></div></div><div class="art"><img src="img/fats-basics/step-02.png" alt="Step 2: Single bond vs double bond" loading="eager" decoding="async"></div><figcaption>Two carbons can share one pair of electrons (single bond) or two pairs (double bond). Carbon always makes 4 bonds in total, so a double-bonded carbon has room for fewer hydrogens.</figcaption></figure><figure class="fig" id="step-3"><div class="fh"><a class="badge" href="#step-3">3</a><div><div class="fl">Step 3</div><h3>Carbons link into a zigzag chain</h3></div></div><div class="art"><img src="img/fats-basics/step-03.png" alt="Step 3: Carbons link into a zigzag chain" loading="lazy" decoding="async"></div><figcaption>Carbons join end to end. The bond angle is about 109.5°, so a chain zigzags instead of running in a straight line. Each carbon fills its remaining bonds with hydrogen.</figcaption></figure><figure class="fig" id="step-4"><div class="fh"><a class="badge" href="#step-4">4</a><div><div class="fl">Step 4</div><h3>Three ways to draw the same chain</h3></div></div><div class="art"><img src="img/fats-basics/step-04.png" alt="Step 4: Three ways to draw the same chain" loading="lazy" decoding="async"></div><figcaption>The same molecule as a 3D ball-and-stick model, a full structural formula, and the skeletal line drawing used on the Fats page. In a line drawing every corner is a carbon and the hydrogens on carbons are left out.</figcaption></figure><figure class="fig" id="step-5"><div class="fh"><a class="badge" href="#step-5">5</a><div><div class="fl">Step 5</div><h3>The acid head: the carboxyl group</h3></div></div><div class="art"><img src="img/fats-basics/step-05.png" alt="Step 5: The acid head: the carboxyl group" loading="lazy" decoding="async"></div><figcaption>Every fatty acid ends in a carboxyl group, –COOH: one carbon double-bonded to an oxygen and single-bonded to an O–H. This "acid" end is what later attaches to glycerol.</figcaption></figure><figure class="fig" id="step-6"><div class="fh"><a class="badge" href="#step-6">6</a><div><div class="fl">Step 6</div><h3>A fatty acid = acid head + carbon tail</h3></div></div><div class="art"><img src="img/fats-basics/step-06.png" alt="Step 6: A fatty acid = acid head + carbon tail" loading="lazy" decoding="async"></div><figcaption>Butyric acid (C4:0), the short fat in butter: an acid head plus a tail of carbons. Carbons are numbered from the head, so C1 is the acid carbon.</figcaption></figure><figure class="fig" id="step-7"><div class="fh"><a class="badge" href="#step-7">7</a><div><div class="fl">Step 7</div><h3>A long fatty acid: stearic acid</h3></div></div><div class="art"><img src="img/fats-basics/step-07.png" alt="Step 7: A long fatty acid: stearic acid" loading="lazy" decoding="async"></div><figcaption>Real food fats are longer. Stearic acid has 18 carbons, C1 to C18, with no double bonds, so the zigzag runs straight.</figcaption></figure><figure class="fig" id="step-8"><div class="fh"><a class="badge" href="#step-8">8</a><div><div class="fl">Step 8</div><h3>Saturated = full of hydrogen</h3></div></div><div class="art"><img src="img/fats-basics/step-08.png" alt="Step 8: Saturated = full of hydrogen" loading="lazy" decoding="async"></div><figcaption>In a saturated chain every tail carbon holds two hydrogens (the end carbon holds three). There is no room for more, so the chain is "saturated" with hydrogen.</figcaption></figure><figure class="fig" id="step-9"><div class="fh"><a class="badge" href="#step-9">9</a><div><div class="fl">Step 9</div><h3>A double bond removes two hydrogens</h3></div></div><div class="art"><img src="img/fats-basics/step-09.png" alt="Step 9: A double bond removes two hydrogens" loading="lazy" decoding="async"></div><figcaption>Compare C9–C10 in stearic acid (single bond, four H) with oleic acid (double bond, two H). "Unsaturated" means hydrogens are missing because a double bond took their place.</figcaption></figure><figure class="fig" id="step-10"><div class="fh"><a class="badge" href="#step-10">10</a><div><div class="fl">Step 10</div><h3>Cis vs trans</h3></div></div><div class="art"><img src="img/fats-basics/step-10.png" alt="Step 10: Cis vs trans" loading="lazy" decoding="async"></div><figcaption>At a double bond the hydrogens can sit on the same side (cis), which bends the chain, or on opposite sides (trans), which keeps it straight. Natural unsaturated fats are almost all cis.</figcaption></figure><figure class="fig" id="step-11"><div class="fh"><a class="badge" href="#step-11">11</a><div><div class="fl">Step 11</div><h3>One cis double bond = one kink: oleic acid</h3></div></div><div class="art"><img src="img/fats-basics/step-11.png" alt="Step 11: One cis double bond = one kink: oleic acid" loading="lazy" decoding="async"></div><figcaption>Oleic acid (C18:1 cis-9), the main fat in olive oil, has a single cis double bond between C9 and C10 that puts one kink in the chain.</figcaption></figure><figure class="fig" id="step-12"><div class="fh"><a class="badge" href="#step-12">12</a><div><div class="fl">Step 12</div><h3>Straight vs kinked, side by side</h3></div></div><div class="art"><img src="img/fats-basics/step-12.png" alt="Step 12: Straight vs kinked, side by side" loading="lazy" decoding="async"></div><figcaption>Stearic (saturated, straight) above oleic (cis, kinked) in the same ball-and-stick style, numbered C1 to C18 with the double bond in orange.</figcaption></figure><figure class="fig" id="step-13"><div class="fh"><a class="badge" href="#step-13">13</a><div><div class="fl">Step 13</div><h3>Space-filling: the real shape</h3></div></div><div class="art"><img src="img/fats-basics/step-13.png" alt="Step 13: Space-filling: the real shape" loading="lazy" decoding="async"></div><figcaption>Drawn at true atom sizes, each fatty acid is a solid rod. Stearic is a straight rod; oleic is bent at the cis double bond.</figcaption></figure><figure class="fig" id="step-14"><div class="fh"><a class="badge" href="#step-14">14</a><div><div class="fl">Step 14</div><h3>Why shape decides solid vs liquid</h3></div></div><div class="art"><img src="img/fats-basics/step-14.png" alt="Step 14: Why shape decides solid vs liquid" loading="lazy" decoding="async"></div><figcaption>Straight rods stack tightly, so saturated fats like butter are solid. Kinked rods leave gaps and slide past each other, so oils like olive oil are liquid.</figcaption></figure><figure class="fig" id="step-15"><div class="fh"><a class="badge" href="#step-15">15</a><div><div class="fl">Step 15</div><h3>Omega numbers: count from the tail</h3></div></div><div class="art"><img src="img/fats-basics/step-15.png" alt="Step 15: Omega numbers: count from the tail" loading="lazy" decoding="async"></div><figcaption>Omega numbers count from the tail end (ω1 = the last carbon). If the first double bond starts at ω3 it is an omega-3 (ALA); at ω6 it is an omega-6 (linoleic acid).</figcaption></figure><figure class="fig" id="step-16"><div class="fh"><a class="badge" href="#step-16">16</a><div><div class="fl">Step 16</div><h3>Putting it together: a triglyceride</h3></div></div><div class="art"><img src="img/fats-basics/step-16.png" alt="Step 16: Putting it together: a triglyceride" loading="lazy" decoding="async"></div><figcaption>Glycerol holds three fatty acids through ester bonds. This one carries a saturated, a monounsaturated and an omega-6 chain. Almost all fat in food and in your body is built this way.</figcaption></figure></main><nav class="pn"><span style="flex:1"></span><a class="nx" href="macronutrients-fats.html"><small>Next lesson →</small>Fats: shapes, omegas and trans</a></nav><script>const setT=t=>{document.documentElement.dataset.theme=t;theme.textContent=t=='dark'?'Light':'Dark'};let st=null;try{st=localStorage.getItem('theme')}catch(e){}setT(st||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));theme.onclick=()=>{const t=document.documentElement.dataset.theme=='dark'?'light':'dark';setT(t);try{localStorage.setItem('theme',t)}catch(e){}};</script><script>const links=[...document.querySelectorAll('.findex a')],figs=[...document.querySelectorAll('.fig')];let cur='';function spy(){let id=figs[0].id;for(const f of figs)if(f.getBoundingClientRect().top<=window.innerHeight*0.35)id=f.id;if(innerHeight+scrollY>=document.body.scrollHeight-4&&!location.hash)id=figs[figs.length-1].id;if(id!=cur){cur=id;links.forEach(a=>a.classList.toggle('on',a.getAttribute('href')=='#'+id));const a=links.find(a=>a.classList.contains('on'));a&&a.parentNode.scrollTo({left:a.offsetLeft-a.parentNode.clientWidth/2,behavior:'smooth'})}}addEventListener('scroll',spy,{passive:true});addEventListener('hashchange',()=>setTimeout(spy,400));spy();</script></body></html>
